# YOLO dataset descriptor for the VisionOps construction site safety model.
# Generated automatically by scripts/prepare_dataset.py once the raw dataset
# has been downloaded and split. Paths are relative to this file's directory
# unless an absolute path is provided through --data-dir.

path: ../data/processed
train: images/train
val: images/val
test: images/test

names:
  0: Hardhat
  1: Mask
  2: NO-Hardhat
  3: NO-Mask
  4: NO-Safety Vest
  5: Person
  6: Safety Cone
  7: Safety Vest
  8: machinery
  9: vehicle
